trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '22.x'

steps:
  - checkout: self
    displayName: Checkout source
    fetchDepth: 1

  - task: NodeTool@0
    displayName: Use Node.js $(nodeVersion)
    inputs:
      versionSpec: $(nodeVersion)

  - script: cp src/app/api.config.ci.ts src/app/api.config.ts
    displayName: Create non-secret CI configuration

  - script: npm ci
    displayName: Install dependencies

  - script: npm test -- --watch=false
    displayName: Run unit tests

  - script: npm run build -- --configuration production
    displayName: Build production application
