<div class="app-shell">
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" routerLink="/" aria-label="Customer Operations home">
        <span class="brand-mark" aria-hidden="true">CO</span>
        <span>
          <strong>Customer Operations</strong>
          <small>Angular + ASP.NET Core</small>
        </span>
      </a>

      <nav class="primary-nav" aria-label="Primary navigation">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Overview
        </a>
        <a routerLink="/comments" routerLinkActive="active">Comments</a>
        <a routerLink="/inputform" routerLinkActive="active">Forms</a>
        <a routerLink="/nations" routerLinkActive="active">Nations</a>
        <a routerLink="/logistics" [class.active]="inLogistics()" [attr.aria-current]="inLogistics() ? 'page' : null">Logistics</a>
        <a routerLink="/observable" routerLinkActive="active">RxJS</a>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>

  <footer class="app-footer">
    <span>Portfolio application by Richard Wu</span>
    <span>{{ currentYear }} · Angular · ASP.NET Core · Azure</span>
  </footer>
</div>
